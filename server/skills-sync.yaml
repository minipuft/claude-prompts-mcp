# Skills Sync Configuration
#
# Read by `scripts/skills-sync.ts` — export, sync, diff, patch, pull. Of those only export,
# diff and pull have `npm run skills:*` aliases; the rest run through the script directly.
#
# Client knowledge (adapters, output dirs, capabilities) is built into the CLI.
# This file controls WHAT to export. The CLI handles HOW.
#
# Export output is GITIGNORED and regenerated, never committed (.gitignore `skills/`).
# Worked example of every selector form: skills-sync.example.yaml

registrations:
  claude-code:
    user:
      # review + validate_work deregistered 2026-07-12: skill names collided with
      # Claude Code built-ins (/review = PR review, /verify = end-to-end check).
      # diagnose deregistered 2026-07-12: dispatch overlap with /debugging skill
      # and built-in /code-review. All three remain available as MCP prompts:
      # >>review, >>validate_work, >>diagnose.
      - prompt:development/dev-workflow
    project:
      - prompt:examples/reference_demo
  codex:
    user:
      - prompt:development/dev-workflow
    project:
      - prompt:examples/reference_demo
  # Agent Plugins 1.0.0 canonical tree — DELIBERATELY UNREGISTERED.
  #
  # Which resources the native package ships is a per-installation choice, not a project default.
  # An entry here exports on every `skills:export`, so shipping one would make this repo's guess
  # the default for everyone who installs it. Absent (or commented) resolves to `unregistered`
  # and the client is skipped — `resolveClientResourceSelection` (service.ts:606) returns
  # `mode: 'unregistered'` for a missing key, which is the same path as an explicit skip.
  #
  # `project` scope only when you do enable it: the spec fixes skills/ at the plugin root, so a
  # user-scope export would write outside the plugin and never be shipped.
  #
  # To enable, uncomment and name your own resources. Full worked example with every
  # selector form: server/skills-sync.example.yaml
  #
  # agent-plugins:
  #   project:
  #     - prompt:examples/reference_demo
