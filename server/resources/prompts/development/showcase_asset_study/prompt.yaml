id: showcase_asset_study
name: Showcase Asset Study
description: 'Stage-aware creative asset/world/motion review using current owner authorization and delegated root locks; replaceable assets and actual export evidence, with advisory visual judgment.'
category: development
systemMessageFile: system-message.md
userMessageTemplateFile: user-message.md
arguments:
  - name: brief
    type: string
    description: Purpose, agreed project criteria and owner decisions for this one
      asset study.
    required: true
  - name: references
    type: string
    description: Inspected reference paths/URLs with their distinct roles and
      evidence pointers.
    required: false
  - name: frames
    type: string
    description: Exact supplied rough comparison or reviewed world/pose frame paths; stage and approval are stated in the existing brief/context.
    required: false
  - name: output_root
    type: string
    description: Caller-owned output directory for this bounded asset/timing study.
    required: false
    defaultValue: media/showcase/v2/out
  - name: context
    type: string
    description: Prior actual owner grade, approved shape/unit, medium review and current production hold/resume ruling; human-only corrections do not require a selected pair.
    required: false
gateConfiguration:
  include:
    - showcase-asset-continuity
  framework_gates: false
  exclude:
    - creed-fidelity
injection:
  system-prompt:
    enabled: false
