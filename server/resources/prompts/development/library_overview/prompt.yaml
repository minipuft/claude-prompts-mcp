id: library_overview
name: Library Overview
category: development
description: >-
  Quick assessment of a library/framework: popularity, maintenance, ecosystem fit.
  Step 1 of the tech evaluation chain.
userMessageTemplateFile: user-message.md
arguments:
  - name: library
    type: string
    description: The library or framework to evaluate (e.g., 'zod', 'react-query', 'prisma')
    required: true
  - name: context
    type: string
    description: Your project context and what problem you're solving
    required: true
  - name: current_stack
    type: string
    description: Current tech stack (optional, helps assess compatibility)
    required: false
