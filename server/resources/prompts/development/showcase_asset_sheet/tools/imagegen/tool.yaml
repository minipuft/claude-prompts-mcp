id: imagegen
name: Image Generation (codex exec)
description: Draw one asset with Codex's image tool from board images as
  references (D65/D66); copies the result to `out` unchanged and returns prompt,
  referenced_image_paths, source path and sha256; refuses on a missing file.
script: script.py
runtime: python
timeout: 295000
enabled: true
execution:
  trigger: explicit
  confirm: true
  strict: false
