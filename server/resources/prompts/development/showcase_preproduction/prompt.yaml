id: showcase_preproduction
name: Showcase Pre-production
description: "Once per episode: rebuild the board, write the story and beats,
  break them into shots with the object inventory, and grade the package; the
  muse then runs per object from the inventory (showcase_asset_muse) before any
  showcase_shot run."
category: development
userMessageTemplateFile: user-message.md
arguments:
  - name: brief
    type: string
    description: Audience, product goal and desired silent showcase outcome.
    required: true
  - name: constraints
    type: string
    description: Duration, dimensions, renderer and evidence limits.
    required: false
    defaultValue: ~40 s at 30 fps, 1280x720, silent, poster at frame 0, swangle
      renderer here, final render on the Windows host.
  - name: output_root
    type: string
    description: Caller-owned production artifact directory.
    required: false
    defaultValue: media/showcase
chainSteps:
  - promptId: showcase_board
    inputMapping:
      brief: brief
      output_root: output_root
    id: board
    stepName: Board
  - promptId: showcase_story
    inputMapping:
      brief: brief
      constraints: constraints
      context: previous_step_result
      output_root: output_root
    id: story
    stepName: Story and Beats
  - promptId: showcase_shotlist
    inputMapping:
      brief: brief
      constraints: constraints
      context: previous_step_result
      output_root: output_root
    id: shots
    stepName: Shot List and Inventory
  - promptId: showcase_review
    inputMapping:
      brief: brief
      constraints: constraints
      context: previous_step_result
      output_root: output_root
    inlineGateIds:
      - showcase-review
    id: grade
    stepName: Package Grade
artifacts:
  produces:
    - docs
    - plan
systemMessageFile: system-message.md
