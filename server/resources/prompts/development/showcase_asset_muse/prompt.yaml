id: showcase_asset_muse
name: Showcase Asset Muse
description: "Between-iteration muse for one showcase asset: design_muse on the
  board and the existing cast, then 3+ generated sheets side by side in the
  substrate, then a rubric grade. No asset enters a scene without it (D55); the
  pick proceeds to a model sheet (D72)."
category: development
userMessageTemplateFile: user-message.md
arguments:
  - name: asset
    type: string
    description: The asset's job in the script's resource vocabulary.
    required: true
  - name: constraints
    type: string
    description: The style envelope the variants must stay inside.
    required: false
    defaultValue: Generated sheets only (D65/D66), pure black field, five flat roles
      with identity pigments pinned, pale contour, clean-up standard (D72);
      variants must sit between the board cards cited and the existing cast. The
      owner's pick then gets a model sheet (showcase_model_sheet) before any key
      sheet; nothing is animated by generation (D68).
chainSteps:
  - promptId: design_muse
    args:
      mode: brainstorm
      moodboard: media/showcase/v3/references/style-references.json
      seed_refs: "The existing cast under media/showcase/src/library/cast and props:
        their silhouettes are the other end of the space a new asset must sit
        between."
    inputMapping:
      challenge: asset
      constraints: constraints
    id: muse
    stepName: Reference Directions
  - promptId: showcase_asset_sheet
    inputMapping:
      asset: asset
      context: previous_step_result
    delegated: true
    id: sheet
    stepName: Rendered Sheet
  - promptId: showcase_review
    inputMapping:
      brief: asset
      context: previous_step_result
    inlineGateIds:
      - showcase-review
    id: grade
    stepName: Sheet Grade
artifacts:
  produces:
    - source
    - docs
systemMessageFile: system-message.md
