id: showcase_review
name: Showcase Review
description: Inspect actual showcase playback and render artifacts, assess
  silent comprehension, motion, positioning and proof before preparing exports.
category: development
systemMessageFile: system-message.md
userMessageTemplateFile: user-message.md
arguments:
  - name: brief
    type: string
    description: Audience, product goal and desired silent showcase outcome.
    required: true
  - name: context
    type: string
    description: Prior step output; read shared chain history for earlier evidence
      and decisions.
    required: false
  - name: output_root
    type: string
    description: Caller-owned production artifact directory.
    required: false
    defaultValue: media/showcase/output
  - name: constraints
    type: string
    description: Duration, dimensions, accessibility, renderer and evidence limits.
    required: false
    defaultValue: Silent motion film; evidence-backed product claims; client-owned
      rendering; no publishing.
  - name: motion_contract
    type: string
    description: Complete authored motion specification for comparing the actual render.
    required: false
gateConfiguration:
  framework_gates: false
artifacts:
  produces:
    - docs
    - plan
