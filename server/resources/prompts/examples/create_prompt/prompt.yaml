id: create_prompt
name: Create Prompt
description: >-
  Designs, previews, confirms, and creates canonical prompts through
  resource_manager without duplicating validation.
category: prompt-authoring
userMessageTemplateFile: user-message.md
arguments:
  - name: name
    type: string
    description: Prompt name for design or creation
    required: false
  - name: purpose
    type: string
    description: Core purpose in one or two sentences
    required: false
  - name: prompt_type
    type: string
    description: 'Design mode: template, script, chain, or system-only'
    required: false
  - name: id
    type: string
    description: Stable prompt identifier
    required: false
  - name: category
    type: string
    description: Prompt category
    required: false
  - name: description
    type: string
    description: What the prompt does
    required: false
  - name: systemMessage
    type: string
    description: Inline system message
    required: false
  - name: userMessageTemplate
    type: string
    description: Inline Nunjucks user-message template
    required: false
  - name: arguments
    type: array
    description: Typed prompt argument definitions
    required: false
  - name: gateConfiguration
    type: object
    description: Gate configuration
    required: false
  - name: chainSteps
    type: array
    description: Chain step definitions
    required: false
  - name: registerWithMcp
    type: boolean
    description: Expose through native MCP prompts
    required: false
  - name: tools
    type: array
    description: Complete inline script-tool definitions
    required: false
tools:
  - prompt_builder
