id: plan_table
name: Plan-Table (Step 4)
category: planning
description: >-
  Step 4 of the implementation planning chain. Produces the tier-gated
  implementation table — task rows with a Status column tier_execute can drive
  directly — plus per-task verification, justification for new files, execution
  dispatch, open questions with status, and a changelog entry.
userMessageTemplateFile: user-message.md
arguments:
  - name: feature
    type: string
    description: The feature or functionality to implement
    required: true
  - name: design_mode
    type: string
    description: >-
      Design Enrichment toggle: auto | on | off. Default auto — keyword-detects
      visual/creative/UI intent from the feature text. When active, design
      Decisions from Phase 1 land in the plan. Generic, no framework name.
    required: false
