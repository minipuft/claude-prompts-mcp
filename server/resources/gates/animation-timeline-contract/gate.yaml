id: animation-timeline-contract
name: Animation Timeline Contract
type: validation
description: "Check-tier gate on the timeline step: the compiled timeline's
  beats cover the duration without gaps, every transition names a window inside
  both beats, every hold sits in the measured band."
guidanceFile: guidance.md
pass_criteria:
  - type: shell_verify
    shell_command:
      - python3
      - scripts/animation/probe-timeline.py
      - v3/timeline.json
    shell_timeout: 600000
    shell_working_dir: ../media/showcase
    shell_max_attempts: 1
    shell_preset: full
activation:
  prompt_categories:
    - animation
  explicit_request: true
retry_config:
  max_attempts: 2
  improvement_hints: true
  preserve_context: true
subject: animation-timeline-contract
severity: high
enforcementMode: blocking
gate_type: custom
