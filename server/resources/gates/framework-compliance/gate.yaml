id: framework-compliance
name: Framework Compliance
type: validation
gate_type: framework
description: >-
  Ensures responses follow the active framework (CAGEERF, ReACT, 5W1H, SCAMPER).
  Requires BOTH a matching framework context AND a relevant prompt category to activate.
  This prevents framework gates from applying to simple prompts like greetings.
# subject tags this gate for harnessCovers suppression (see _index.md Subject column)
subject: framework
guidanceFile: guidance.md
pass_criteria:
  - type: inline_guidance

retry_config:
  max_attempts: 2
  improvement_hints: true
  preserve_context: true

activation:
  prompt_categories:
    - development
    - analysis
    - research
    - architecture
    - debugging
    - documentation
    - planning
  explicit_request: false
  framework_context:
    - CAGEERF
    - ReACT
    - 5W1H
    - SCAMPER
