# Gate Verdict Validation Configuration
#
# Rationale requirements for a structured `gate_verdict` submission
# ({overall, rationale, per_gate?, reminders?}). The MCP schema already refuses an
# empty or multi-line rationale; these settings can only tighten that.

validation:
  # Rationale is required for all verdicts
  require_rationale: true
  # Minimum rationale length (characters)
  min_rationale_length: 1
