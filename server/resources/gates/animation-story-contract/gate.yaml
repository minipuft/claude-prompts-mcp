id: animation-story-contract
name: Animation Story Contract
type: validation
description: "Check-tier gate on the chain's first step (row 9.8): the
  screenplay holds its contract and the film's themes hold on the staging before
  a beat is timed, so a beat whose story points lack a want or a turn, a recipe
  for every measure clause, or a theme cannot enter posing. Two probes run in
  order, both without frames: probe-screenplay.py (shape, themes and their tags,
  recipes, want and turn, current renders) and probe-theme.py (the frame is
  carried in at sp-4.2 and on no frame before, the gadget is seen only through
  glass, one lit join at a time, every light line resolves to a target the eye
  trace measures). The frames-reading probe-story.py stays on `animation-story`,
  which runs where there are frames to read."
guidanceFile: guidance.md
pass_criteria:
  - type: shell_verify
    shell_command:
      - python3
      - scripts/animation/probe-screenplay.py
      - v3/screenplay.json
    shell_timeout: 120000
    shell_working_dir: ../media/showcase
    shell_max_attempts: 1
    shell_preset: full
  - type: shell_verify
    shell_command:
      - python3
      - scripts/animation/probe-theme.py
      - v3/screenplay.json
    shell_timeout: 120000
    shell_working_dir: ../media/showcase
    shell_max_attempts: 1
    shell_preset: full
activation:
  prompt_categories:
    - animation
    - development
  explicit_request: true
retry_config:
  max_attempts: 2
  improvement_hints: true
subject: animation-story-contract
severity: high
enforcementMode: blocking
gate_type: custom
