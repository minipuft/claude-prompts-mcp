id: animation-colour-script
name: Animation Colour Script
type: validation
description: "Check-tier gate on the light-script step: one hue pair per beat
  (D74), one emitter at a time, no hue detour across a crossing (C15 at episode
  scale, C30)."
guidanceFile: guidance.md
pass_criteria:
  - type: shell_verify
    shell_command:
      - python3
      - scripts/animation/probe-colour.py
      - --contract
      - v3/light.json
      - --timeline
      - v3/timeline.json
    shell_timeout: 600000
    shell_working_dir: ../media/showcase
    shell_max_attempts: 1
    shell_preset: full
activation:
  prompt_categories:
    - animation
  explicit_request: true
retry_config:
  max_attempts: 2
  improvement_hints: true
  preserve_context: true
subject: animation-colour-script
severity: high
enforcementMode: blocking
gate_type: custom
