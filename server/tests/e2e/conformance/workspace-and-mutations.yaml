  # ── R46: a key the contract does not declare is refused, over the real transport ───────────
  #
  # `resourceManagerInputSchema` is `.passthrough()`, so an undeclared key ARRIVES — it is not
  # stripped, and before this it was read by nobody while the call answered success. Driving it
