            - from: step-a
              to: step-b
    expect:
      error_contains: '''edges'' is not a parameter of resource_type:"gate"'

  # ── P4.82: `budget` and `artifacts`, the last two loader-accepted keys nothing could write ──
  #
  # Measured 2026-09-20 before the fix: `update` carrying either answered "Prompt Updated", saved
  # a version, and left the file unchanged; `create` carrying both wrote neither. `inspect` renders
  # neither field, so every observable below is the write itself — the diff the update prints, or
  # the refusal.
  - id: prompt-budget-and-artifacts-are-written-then-cleared-by-unset
    claim_source: >-
      resource_manager contract — `budget` and `artifacts`: "Send `unset: [\"budget\"]` to drop the
      declaration and run on the server defaults" / "Send `unset: [\"artifacts\"]` to declare
      nothing."
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_budget_artifacts
          name: Conformance Budget Artifacts
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_BUDGET_ARTIFACTS_BODY {{files}}
          arguments:
            - name: files
              description: paths this run touches
          chain_steps:
            - promptId: minimal_prompt
              stepName: Step A
          budget:
            maxInsertions: 1
            pauseOnBlocking: true
          artifacts:
            produces:
              - plan
            fromArgument: files
      - tool: resource_manager
        args:
          resource_type: prompt
          action: update
          id: conformance_budget_artifacts
          unset: ['budget', 'artifacts']
    # One substring, both claims. The removed block can only appear in this diff if `create`
    # actually WROTE both fields — the state the pre-fix server reported success for and did not
    # reach — and it can only appear as removals if `unset` reached both keys.
    expect:
      text_contains: "-budget:\n-  maxInsertions: 1\n-  pauseOnBlocking: true\n-artifacts:\n-  produces:\n-    - plan\n-  fromArgument: files"

  - id: prompt-budget-above-the-cap-is-refused-by-the-loaders-own-bound
    claim_source: >-
      resource_manager contract — `budget`: "A declared structural cap may only NARROW the server
      default, so a value above it is refused here rather than silently clamped." The bound is
      `workflowBudgetSchema`'s own `.max(DEFAULT_WORKFLOW_CAPS.*)`, which the tool schema uses
      directly rather than restating.
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: update
          id: conformance_budget_artifacts
          budget:
            maxInsertions: 99
    # `Invalid arguments for tool resource_manager` is the BOUNDARY's phrasing — nothing was
    # written and no version spent. Asserting only the cap text would also pass on a loose
    # boundary schema that let the value through to the post-write check, which refuses it too but
    # after a write and a rollback; measured 2026-09-20 by replacing `workflowBudgetSchema` here
    # with `z.record()` and watching this row stay green. The number is
    # `DEFAULT_WORKFLOW_CAPS.maxInsertions`, so a tool-side copy that drifted from the loader's cap
    # would not produce this text either. The row above is the positive control: the same
    # parameter at 1 is accepted and written.
    expect:
      error_contains: 'Invalid arguments for tool resource_manager: budget.maxInsertions: Too big: expected number to be <=3'

  - id: prompt-budget-with-an-unrecognized-key-is-refused-not-dropped
    claim_source: >-
      resource_manager contract — `budget`: "an unrecognized key is refused rather than dropped."
      `workflowBudgetSchema` is `.strict()`.
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: update
          id: conformance_budget_artifacts
          budget:
            maxInsertion: 1
    expect:
      error_contains: "Invalid arguments for tool resource_manager: budget: 'budget.maxInsertion' is not a declared key — did you mean 'maxInsertions'?"

  - id: prompt-artifacts-fromargument-must-name-a-declared-argument
    claim_source: >-
      resource_manager contract — `artifacts`: "`fromArgument` … must match an argument the prompt
      declares." Enforced on the written FILE by the post-write verification, because an update
      need not carry `arguments` and the boundary cannot see them.
    requests:
