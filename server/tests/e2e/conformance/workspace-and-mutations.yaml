  # ── P4.7 read-back: resource_type `category` ───────────────────────────────
  #
  # The falsifier for P4.7 stated plainly: a tool call writes a `category.yaml`. Before this,
  # `CategorySchema` had a reader for all five of its fields and no writer anywhere in `src/`, so
  # the only way to author one was by hand — which core principle 1 (MCP Tooling Only) forbids.
  #
  # Both values set below are NON-DEFAULT. `register_with_mcp` resolves to `true` and
  # `mcp_prompt_mode` to `'expand'` when a category declares neither, and `inspect` renders each
  # line ONLY when the document on disk declares the key — so a create that wrote an empty file,
  # or wrote the loader's defaults, prints neither line and fails this row. The name and
  # description are asserted in the same block for the same reason: the loader derives
  # `Conformance Category Readback` → `conformance_category_readback` and
  # `Prompts in the ... category` from the directory name alone, so an authored value that did
  # not survive the round trip is invisible in every other view.
  #
  # MUTATION KILLED: deleting the two `register_with_mcp` / `mcp_prompt_mode` translations from
  # `routeToCategoryManager` (router.ts) reds this row and nothing else in the corpus — `create`
  # still reports success and `inspect` still answers, it just prints no Name line because the
  # whole payload stopped arriving under the names the writer reads. Confirmed by removing them,
  # rebuilding `dist/`, re-running this row (red), and reverting.
  - id: category-create-then-inspect-reads-back-declared-fields
    claim_source: >-
      resource_manager contract — `resource_type: category` (P4.7) authors a prompt category's
      `category.yaml`; `register_with_mcp` and `mcp_prompt_mode` reach it as `registerWithMcp` and
      `mcpPromptMode`, the defaults prompts in the category inherit (loader.ts:176-180).
      `inspect` reads them back off the document, not off the loaded Category.
    requests:
      - tool: resource_manager
        args:
          resource_type: category
          action: create
          id: conformance_category_readback
          name: Conformance Category Readback
          description: created by the conformance corpus
          register_with_mcp: false
          mcp_prompt_mode: launch
      - tool: resource_manager
        args: { resource_type: category, action: inspect, id: conformance_category_readback }
    expect:
      text_contains: "  - Name: Conformance Category Readback\n  - Description: created by the conformance corpus\n  - Register With MCP: false\n  - MCP Prompt Mode: launch"

  # ── system_control fields that change server state ─────────────────────────
  # Here rather than in tool-surface.yaml because each one mutates: analytics reset clears the
  # metrics, and an injection override is session state. The override expires after 1 ms, so it
  # cannot steer any later row's injection decision.
  - id: sc-analytics-reset-confirmed
    claim_source: >-
      system_control contract — `confirm` "Required `true` for operations that replace or discard
      state". analytics reset answers "Metrics reset cancelled" unless `confirm: true` arrives.
    requests:
      - tool: system_control
        args: { action: analytics, operation: reset, confirm: true }
    expect: { text_contains: 'Metrics Reset Completed' }

  - id: sc-injection-override-expiring
    claim_source: >-
      system_control contract — injection override `type`, `enabled`, `scope`, `scope_id` and
      `expires_in_ms`. The confirmation prints each value the override was set with.
    requests:
      - tool: system_control
        args:
          {
            action: injection,
            operation: override,
            type: gate-guidance,
            enabled: true,
            scope: chain,
            scope_id: conformance-probe,
            expires_in_ms: 1,
          }
    expect:
      text_contains: "**Type:** `gate-guidance`\n**Enabled:** ✅ Yes\n**Scope:** chain\n**Scope ID:** conformance-probe\n**Expires:** "

  - id: sc-changes-limit
    claim_source: >-
      system_control contract — changes list `limit` "Maximum entries to return". The prompt
      creates above record mcp-tool changes, and the page header names the limit it applied.
    requests:
      - tool: system_control
        args: { action: changes, operation: list, source: mcp-tool, limit: 1 }
    expect: { text_contains: '(1 of max 1)' }
