# Claims-conformance corpus — workspace overlay, mutating actions, and the resource:// read surface
#
# WHY THIS FILE NEEDS ITS OWN SERVER (`workspace: isolated`)
# Every other corpus file only READS. These rows create, update, roll back and DELETE real files,
# and the shared server's resource tree is `server/resources/` — the repo. A delete row there would
# remove a tracked prompt from the working tree. The driver therefore spawns a second server with
# `MCP_WORKSPACE` pointed at a throwaway copy of the bundled tree.
#
# The isolated workspace also sets `resources.registerWithMcp: true`, which the shipped config
# leaves FALSE. That is not incidental: measured 2026-08-11, the default server answers
# `resources/list` with an empty array and returns "Resource not found" for every URI printed in
# `docs/reference/mcp-tools.md`. The default-off behaviour is asserted on the shared server
# (`prompt-engine-surface.yaml`); the read surface can only be exercised here.
#
# EVERY assertion below is a substring MEASURED from a real server on 2026-08-11, never guessed.
# Each mutating scenario uses a UNIQUE prompt id so one row's leftovers cannot satisfy another's
# claim — the rows share one server, and an id collision would let a stale prompt answer for a
# create that silently failed.
#
# WHY EVERY READ-BACK IS PRECEDED BY `action: reload`
# `update` writes to disk immediately but is NOT live immediately: the change reaches the in-memory
# registry through the file watcher, which is debounced. Measured 2026-08-11 — straight after a
# successful update whose own response printed a V1→V2 diff, both `inspect` AND executing the
# prompt returned the V1 body; the same reads returned V2 after a 4s wait, and after an explicit
# `reload` with no wait. This nearly produced a false defect report, and it silently disarmed the
# first draft of `prompt-rollback-restores-previous-content`: that row asserted V1 after a rollback
# and passed WITHOUT the rollback ever running, because the stale registry was still serving V1
# either way. Removing `confirm: true` — which makes rollback fail outright — did not red the row.
# An explicit reload is deterministic where a sleep is a race, so every read-back forces one.

version: 1
workspace: isolated

scenarios:
  # ── Workspace overlay (CLAUDE.md § Environment) ────────────────────────────
  - id: workspace-overlay-serves-overlay-only-prompt
    claim_source: >-
      CLAUDE.md § Key Constraints — "Workspace resources overlay bundled ones." Implemented by
      PathResolver.getOverlayResourceDirs (paths.ts:359-366) and data-loader.ts:112-128.
    requests:
      - tool: prompt_engine
        args: { command: '>>overlay_probe' }
    # `overlay_probe` exists ONLY in `<workspace>/prompts/`, never in the bundled tree, so serving
    # its body proves the overlay directory was merged. Asserting the MARKER rather than `ok:` is
    # what distinguishes "the overlay was loaded" from "some prompt by that name resolved" — and
    # the entire overlay branch is unreachable unless the workspace differs from the package root,
    # which no scenario exercised before this file existed.
    expect: { text_contains: 'OVERLAY_PROBE_MARKER' }

  # ── resource:// reads (plan row 0.5.8) ─────────────────────────────────────
  - id: resource-list-advertises-prompt-uris
    claim_source: >-
      docs/reference/mcp-tools.md § MCP Resources — "resource://prompt/{id} → Full prompt with
      metadata + template". docs/architecture/overview.md:388 — "the server exposes MCP Resources".
    requests: [{ method: resources/list }]
    expect: { resources_include: ['resource://prompt/minimal_prompt'] }

  - id: resource-read-prompt-by-id
    claim_source: >-
      docs/reference/mcp-tools.md § Resource URIs — `resource://prompt/{id}` returns "Full prompt
      with metadata + template".
    requests: [{ method: resources/read, args: { uri: 'resource://prompt/minimal_prompt' } }]
    # The claim is metadata AND template, so assert a string only the rendered document contains.
    expect: { text_contains: '**ID:** `minimal_prompt`' }

  - id: resource-read-nested-id-is-unreachable
    claim_source: >-
      docs/reference/mcp-tools.md § Resource URIs — `resource://prompt/{id}` is documented as
      readable for every id, and `resources/list` advertises nested ids such as
      `resource://prompt/deep_analysis/initial_scan` with no marking that they differ.
    requests:
      - method: resources/read
        args: { uri: 'resource://prompt/deep_analysis/initial_scan' }
    expect: { text_contains: '**ID:** `deep_analysis/initial_scan`' }
    known_divergence:
      measured: >-
        The URI is ADVERTISED by resources/list and 404s on read: "Resource not found:
        resource://prompt/deep_analysis/initial_scan". Ids containing a slash — nested prompt
        categories — are listed but unreadable, so a client that enumerates the surface and reads
        each entry fails on a subset with no way to tell which in advance. Measured 2026-08-11
        against a server with registerWithMcp enabled; `resource://prompt/minimal_prompt` (no
        slash) reads correctly in the same run, which isolates the slash as the cause.
      closed_by: >-
        Either the read handler matching multi-segment ids, or resources/list ceasing to advertise
        ids it cannot serve. Then delete this block so the row asserts the claim directly.
      since: '2026-08-11'

  # ── Mutating lifecycle (plan row 0.5.10) ───────────────────────────────────
  - id: prompt-create-then-inspect
    claim_source: >-
      resource_manager contract — action `create` for resource_type `prompt`, and `inspect` which
      "Returns full prompt definition".
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_create
          name: Conformance Create
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_CREATE_MARKER
      - tool: resource_manager
        args: { resource_type: prompt, action: inspect, id: conformance_create, detail: full }
    # Asserts the created BODY comes back, not that create returned ok. A create that wrote no
    # template would still report success, and the inspect would still succeed on the metadata.
    expect: { text_contains: 'CONFORMANCE_CREATE_MARKER' }

  - id: prompt-update-saves-a-version
    claim_source: >-
      resource_manager contract — `update` auto-versions unless `skip_version` is set; version
      history is what `rollback` and `history` operate on.
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_version
          name: Conformance Version
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_V1_MARKER
      - tool: resource_manager
        args:
          resource_type: prompt
          action: update
          id: conformance_version
          user_message_template: CONFORMANCE_V2_MARKER
    # Go-forward numbering (P7 row 2.4): version N is the state edit N PRODUCED. The first update
    # of a never-recorded prompt lays a self-healing bridge row (v1 = the pre-edit content the
    # create produced), then records its own result as v2 — so v2 is the deterministic number here.
    expect: { text_contains: '**Version 2** saved' }

  - id: prompt-update-refuses-a-stale-expected-version
    claim_source: >-
      resource_manager contract — `expected_version` is an optimistic-concurrency token and a
      mismatch refuses the update before any prompt file is written.
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_expected_version
          name: Conformance Expected Version
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_EXPECTED_VERSION_V1
      - tool: resource_manager
        args:
          resource_type: prompt
          action: update
          id: conformance_expected_version
          expected_version: 999
          user_message_template: CONFORMANCE_EXPECTED_VERSION_V2
    expect: { error_contains: 'expected version 999' }

  - id: prompt-update-is-live-after-reload
    claim_source: >-
      README § "All hot-reloadable" — an updated prompt body is served by the running server
      without a restart. resource_manager `reload` — "Hot reload completed - All prompts refreshed
      from disk."
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_hotreload
          name: Conformance Hot Reload
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_V1_MARKER
      - tool: resource_manager
        args:
          resource_type: prompt
          action: update
          id: conformance_hotreload
          user_message_template: CONFORMANCE_V2_MARKER
      - tool: resource_manager
        args: { resource_type: prompt, action: reload, id: conformance_hotreload }
      # EXECUTE rather than inspect: the claim is that the running server serves the new body, and
      # inspect could in principle read the file while execution still used a cached template.
      - tool: prompt_engine
        args: { command: '%clean >>conformance_hotreload' }
    expect: { text_contains: 'CONFORMANCE_V2_MARKER' }

  - id: prompt-rollback-requires-confirmation
    claim_source: >-
      resource_manager `confirm` parameter — "Safety confirmation" for destructive actions. The
      server's own message names rollback as one of them.
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_rollback_guard
          name: Conformance Rollback Guard
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_V1_MARKER
      - tool: resource_manager
        args:
          resource_type: prompt
          action: update
          id: conformance_rollback_guard
          user_message_template: CONFORMANCE_V2_MARKER
      - tool: resource_manager
        args:
          { resource_type: prompt, action: rollback, id: conformance_rollback_guard, version: 1 }
    expect: { error_contains: "'rollback' is destructive and requires confirmation" }

  - id: prompt-rollback-restores-previous-content
    claim_source: >-
      resource_manager contract — `rollback` "Restore a previous version". README § versioning —
      "all versioned with rollback".
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_rollback
          name: Conformance Rollback
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_V1_MARKER
      - tool: resource_manager
        args:
          resource_type: prompt
          action: update
          id: conformance_rollback
          user_message_template: CONFORMANCE_V2_MARKER
      # Make V2 the LIVE body before rolling back. Without this the registry is still serving V1
      # from creation time, and the final assertion below would hold whether or not the rollback
      # ran at all — measured, see the file header.
      - tool: resource_manager
        args: { resource_type: prompt, action: reload, id: conformance_rollback }
      - tool: resource_manager
        args:
          resource_type: prompt
          action: rollback
          id: conformance_rollback
          version: 1
          confirm: true
      - tool: resource_manager
        args: { resource_type: prompt, action: reload, id: conformance_rollback }
      - tool: prompt_engine
        args: { command: '%clean >>conformance_rollback' }
    # V1 here can only mean the rollback restored it: the preceding reload made V2 the served body,
    # so a rollback that silently no-opped would leave V2 in this response. `ok: true` cannot see
    # the difference — the same blindness that let the framework-application defect survive.
    expect: { text_contains: 'CONFORMANCE_V1_MARKER' }

  - id: prompt-delete-removes-the-prompt
    claim_source: >-
      resource_manager contract — `delete` "Remove a resource". The follow-up inspect is the
      server's own evidence that it is gone.
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_delete
          name: Conformance Delete
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_DELETE_MARKER
      - tool: resource_manager
        args: { resource_type: prompt, action: delete, id: conformance_delete, confirm: true }
      - tool: resource_manager
        args: { resource_type: prompt, action: inspect, id: conformance_delete }
    expect: { error_contains: 'Prompt not found: conformance_delete' }

  - id: prompt-delete-honors-the-confirm-safety
    claim_source: >-
      resource_manager `confirm` parameter, schema text — "Required `true` for destructive
      actions: `delete` and `rollback`. Both refuse without it." Enforced on delete since the
      4.0 line; before that the sentence named delete while only rollback read the parameter.
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_delete_guard
          name: Conformance Delete Guard
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_DELETE_GUARD_MARKER
      - tool: resource_manager
        args: { resource_type: prompt, action: delete, id: conformance_delete_guard }
    expect: { error_contains: 'requires confirmation' }

  # ── Framework switch round-trip (Tier 0.5b row B2) ─────────────────────────
  #
  # Isolated because `switch` PERSISTS: it writes `kv_state key='framework'`, and on the shared
  # server that is the developer's own active framework. The row was marked BLOCKED on A1 for two
  # days after A1 had landed — nothing re-checks a blocked row's blocker.
  #
  # Both rows switch to 5W1H themselves rather than depending on each other, so they are
  # order-independent and idempotent. They deliberately leave the isolated server on 5W1H; every
  # other row in this file either passes `%clean` or asserts a body marker that no framework
  # changes, so nothing above depends on which framework is active.
  - id: framework-switch-changes-the-active-framework
    claim_source: >-
      system_control `framework` action, operation `switch` — CLAUDE.md § Domain Ownership routes
      framework selection through FrameworkManager. The `list` operation marks the active one.
    requests:
      - tool: system_control
        args: { action: framework, operation: switch, framework: '5w1h' }
      - tool: system_control
        args: { action: framework, operation: list }
    # Reads the state BACK rather than trusting the switch's own success banner. `ok:` is provably
    # blind here — a switch that reported success and changed nothing would satisfy it, which is the
    # same shape as the framework that applied its banner but not its guidance (row D6).
    expect: { text_contains: '**5W1H Framework** 🟢 ACTIVE' }

  - id: framework-switch-is-observable-in-execution
    claim_source: >-
      system_control `framework` switch — the point of switching is that subsequent executions use
      the new framework's guidance, not merely that a registry field changed.
    requests:
      - tool: system_control
        args: { action: framework, operation: switch, framework: '5w1h' }
      - tool: prompt_engine
        args: { command: '>>minimal_prompt' }
    # The strongest available assertion: the switched framework's guidance reaches the response.
    # A registry that updated without the pipeline reading it would pass the row above and fail
    # this one, which is why both exist.
    expect: { text_contains: 'operating under the 5W1H Framework' }

  # ── The remove verb (P2.1 / P2.3) ──────────────────────────────────────────
  - id: prompt-unset-clears-a-field
    claim_source: >-
      resource_manager contract — `unset` CLEARS the named fields, and unsetting `system_message`
      also deletes system-message.md so no orphan file is left behind.
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_unset
          name: Conformance Unset
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_UNSET_BODY
          system_message: CONFORMANCE_UNSET_SYSTEM_MARKER
      - tool: resource_manager
        args:
          resource_type: prompt
          action: update
          id: conformance_unset
          unset: [system_message]
      - tool: resource_manager
        args: { resource_type: prompt, action: inspect, id: conformance_unset, detail: full }
    # Asserts the system message is GONE from the served definition. Asserting the update returned
    # ok would pass against a no-op — which is precisely how this defect presented before the fix:
    # omission is the writer's preserve signal, so a removal that only dropped the in-memory key
    # reported success and changed nothing on disk.
    # `text_contains` is the positive control the harness now REQUIRES alongside any absence: the
    # prompt must still be served (so the probe demonstrably sees this prompt) before "the system
    # message is gone" means anything.
    expect:
      text_contains: 'CONFORMANCE_UNSET_BODY'
      text_not_contains: 'CONFORMANCE_UNSET_SYSTEM_MARKER'

  - id: prompt-unset-refuses-a-structural-field-by-name
    claim_source: >-
      resource_manager contract — `name`, `category`, `description` and `user_message_template`
      are refused by name; they stay settable but a prompt missing one does not load.
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_unset_refused
          name: Conformance Unset Refused
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_UNSET_REFUSED_BODY
      - tool: resource_manager
        args:
          resource_type: prompt
          action: update
          id: conformance_unset_refused
          unset: [user_message_template]
    # The refusal must NAME the field — a generic rejection would not tell the caller which of a
    # multi-field unset list stopped the call.
    expect: { error_contains: 'user_message_template' }

  - id: prompt-tool-removal-requires-confirmation
    claim_source: >-
      resource_manager contract — `tool_operation: "remove"` deletes the tools/{id}/ directories
      and therefore requires `confirm: true`, unlike every other update.
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_tool_remove
          name: Conformance Tool Remove
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_TOOL_REMOVE_BODY
          tools:
            - id: conformance_tool
              name: Conformance Tool
              runtime: python
              script: 'print("conformance")'
      - tool: resource_manager
        args:
          resource_type: prompt
          action: update
          id: conformance_tool_remove
          tool_operation: remove
          tool_ids: [conformance_tool]
    # No `confirm`, so the call must refuse and say so. This is the arm that proves the
    # confirmation is structural rather than advisory.
    expect: { error_contains: 'confirm: true' }

  # ── Preview as an action (P2.2) ────────────────────────────────────────────

  - id: prompt-delete-preview-needs-no-confirmation
    claim_source: >-
      resource_manager contract — `action: "preview"` writes nothing and records no version, so it
      is not a destructive action and takes no `confirm`. This is the claim the `dry_run` boolean
      could not make: the guard keys on `action`, so previewing a deletion demanded confirmation of
      the deletion.
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_delete_preview
          name: Conformance Delete Preview
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_DELETE_PREVIEW_BODY
      - tool: resource_manager
        args:
          resource_type: prompt
          action: preview
          preview_action: delete
          id: conformance_delete_preview
    expect:
      text_contains: 'Nothing was removed'
      # The discriminating half. Without it a refusal that happens to mention the prompt would
      # read as a pass, which is how the old behaviour would have scored here.
      text_not_contains: 'requires confirmation'

  - id: prompt-delete-preview-leaves-the-prompt-servable
    claim_source: >-
      resource_manager contract — a preview reports what would be removed and removes nothing, so
      the prompt still resolves afterwards.
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_preview_survives
          name: Conformance Preview Survives
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_PREVIEW_SURVIVES_BODY
      - tool: resource_manager
        args:
          resource_type: prompt
          action: preview
          preview_action: delete
          id: conformance_preview_survives
      - tool: resource_manager
        args:
          resource_type: prompt
          action: inspect
          id: conformance_preview_survives
    # The positive control for the assertion above: the preview claimed to remove nothing, and the
    # prompt is still here to prove it.
    expect: { text_contains: 'conformance_preview_survives' }

  - id: prompt-chain-step-update-edits-only-that-step
    claim_source: >-
      resource_manager contract — `chain_step_operation: "update"` "overlays `chain_step_data`
      onto the step at `chain_step_index`, the per-step analogue of `argument_updates`" (P2.4).
      Omitted fields keep the step's current value, so a sibling step is untouched. `chain_step_data`
      is schema-validated as a full step (same shape as one `chain_steps` entry), so `promptId` is
      resupplied unchanged alongside the field actually being overlaid.
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_chain_step_update
          name: Conformance Chain Step Update
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_CHAIN_STEP_UPDATE_BODY
          chain_steps:
            - promptId: minimal_prompt
              stepName: Step One
            - promptId: minimal_prompt
              stepName: Step Two
      - tool: resource_manager
        args:
          resource_type: prompt
          action: update
          id: conformance_chain_step_update
          chain_step_operation: update
          chain_step_index: 1
          chain_step_data: { promptId: minimal_prompt, stepName: Step Two Updated }
      - tool: resource_manager
        args: { resource_type: prompt, action: reload, id: conformance_chain_step_update }
      - tool: resource_manager
        args:
          resource_type: prompt
          action: inspect
          id: conformance_chain_step_update
          detail: full
    # One substring spanning both rendered step lines: step 1's line is BYTE-IDENTICAL to what
    # `create` produced, immediately followed by step 2's line carrying the overlay. A `chain_step_
    # operation:"update"` that touched the wrong step, or replaced the whole array, could not
    # produce this exact contiguous pair.
    expect:
      text_contains: "1. `minimal_prompt` - Step One\n2. `minimal_prompt` - Step Two Updated"

  - id: prompt-chain-step-reorder-permutes-existing-steps
    claim_source: >-
      resource_manager contract — `chain_step_operation: "reorder"` applies `chain_step_order`,
      "a permutation of [0..n-1] for the current step count."
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_chain_step_reorder
          name: Conformance Chain Step Reorder
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_CHAIN_STEP_REORDER_BODY
          chain_steps:
            - promptId: minimal_prompt
              stepName: Step Alpha
            - promptId: minimal_prompt
              stepName: Step Beta
      - tool: resource_manager
        args:
          resource_type: prompt
          action: update
          id: conformance_chain_step_reorder
          chain_step_operation: reorder
          chain_step_order: [1, 0]
      - tool: resource_manager
        args: { resource_type: prompt, action: reload, id: conformance_chain_step_reorder }
      - tool: resource_manager
        args:
          resource_type: prompt
          action: inspect
          id: conformance_chain_step_reorder
          detail: full
    # `create` put Alpha first and Beta second; the permutation [1,0] swaps them. Asserting the
    # swapped ORDER (Beta then Alpha) — not just that both names are present — is what only a
    # correctly applied reorder can produce.
    expect:
      text_contains: "1. `minimal_prompt` - Step Beta\n2. `minimal_prompt` - Step Alpha"

  # ── P4.65: `edges` is authorable, and an orphaned edge is refused with a remedy ────────────
  #
  # These three rows are the ONLY place that drives `edges` over the real route — registered tool,
  # router, processor, writer — rather than calling the processor directly. Measured 2026-09-20 on
  # a server built before this parameter existed: an `update` carrying `edges` answered "Prompt
  # Updated", saved a version, and left the file's edges untouched, because nothing downstream read
  # the key. Removing `edges` from `UPDATE_FIELDS` reds the second row here and no boundary gate.
  #
  # Each edge endpoint is the kebab-case id minted from `stepName` — "Step A" → `step-a`.
  - id: prompt-chain-edges-orphaned-by-a-step-rewrite-is-refused-with-the-remedy
    claim_source: >-
      resource_manager contract — `edges`: "An edge naming a step the chain does not declare, or a
      cycle, is refused and the write is rolled back — so a `chain_steps` rewrite that drops a step
      an edge still names must send the corrected `edges` in the SAME call."
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_chain_edges_refusal
          name: Conformance Chain Edges Refusal
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_CHAIN_EDGES_REFUSAL_BODY
          chain_steps:
            - promptId: minimal_prompt
              stepName: Step A
            - promptId: minimal_prompt
              stepName: Step B
            - promptId: minimal_prompt
              stepName: Step C
          edges:
            - from: step-a
              to: step-c
      - tool: resource_manager
        args:
          resource_type: prompt
          action: update
          id: conformance_chain_edges_refusal
          chain_steps:
            - promptId: minimal_prompt
              stepName: Step A
            - promptId: minimal_prompt
              stepName: Step B
    # The defect names the orphaned endpoint; the remedy names the one call that satisfies it.
    # Before P4.65 the first half was identical and the second did not exist, because `edges` was
    # not a parameter at all and the only remedy was a hand edit the project forbids.
    expect:
      error_contains: 'send `edges` in the same `resource_manager` update'

  - id: prompt-chain-edges-sent-with-the-step-rewrite-are-validated-as-one-state
    claim_source: >-
      resource_manager contract — `edges`: "must send the corrected `edges` in the SAME call, which
      is validated as one state."
    requests:
      - tool: resource_manager
        args:
          resource_type: prompt
          action: create
          id: conformance_chain_edges_together
          name: Conformance Chain Edges Together
          category: examples
          description: created by the conformance corpus
          user_message_template: CONFORMANCE_CHAIN_EDGES_TOGETHER_BODY
          chain_steps:
            - promptId: minimal_prompt
              stepName: Step A
            - promptId: minimal_prompt
              stepName: Step B
            - promptId: minimal_prompt
              stepName: Step C
          edges:
            - from: step-a
              to: step-c
      - tool: resource_manager
        args:
          resource_type: prompt
          action: update
          id: conformance_chain_edges_together
          chain_steps:
            - promptId: minimal_prompt
              stepName: Step A
            - promptId: minimal_prompt
              stepName: Step B
          edges:
            - from: step-a
              to: step-b
      - tool: resource_manager
        args: { resource_type: prompt, action: reload, id: conformance_chain_edges_together }
      - tool: resource_manager
        args:
          resource_type: prompt
          action: inspect
          id: conformance_chain_edges_together
          detail: full
    # This row is the ROUTE proof, and the row above is its positive control: the identical update
    # WITHOUT `edges` is refused. A route that dropped `edges` anywhere between the tool call and
    # the writer would leave the created `step-a -> step-c` edge in place, orphan it on this
    # rewrite, and red this row.
    expect:
      text_contains: "1. `minimal_prompt` - Step A\n2. `minimal_prompt` - Step B"
      text_not_contains: 'Step C'

  - id: gate-refuses-edges-by-name
    claim_source: >-
