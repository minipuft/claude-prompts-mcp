        args:
          resource_type: prompt
          action: update
          id: conformance_create
          not_a_parameter: probe-value
    expect:
      error_contains: "'not_a_parameter' is not a parameter of resource_manager"

  - id: resource-manager-refuses-a-near-miss-spelling-of-a-real-parameter
    claim_source: >-
