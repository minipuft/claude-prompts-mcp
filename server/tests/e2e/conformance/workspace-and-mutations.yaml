    # 'high' is non-default (loader default is 'medium') and `enforcementMode` was never
    # supplied, so a definition-level default would print nothing for it — asserting its absence
    # here would be the P4.6-shaped gap this row closes; that field is covered by the sibling row.
    expect: { text_contains: 'Severity: high' }

