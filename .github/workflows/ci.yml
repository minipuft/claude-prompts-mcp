name: CI

# No `paths-ignore` here, deliberately. A PR whose every file matches an ignore
# pattern (a CHANGELOG-only fix, a plan-file-only PR) never triggers the workflow,
# so no check runs are created — which GitHub does not treat as a skipped job. The
# required contexts stay pending forever and the PR can only merge by admin override.
#
# The documented remedy — a companion workflow with the inverse `paths:` trigger and
# identically named no-op jobs — is worse here: `paths` and `paths-ignore` both fire on
# "any file matches", so a mixed docs+code PR triggers BOTH workflows and produces two
# check runs sharing a name. A required context resolves to the most recent run with
# that name, so the no-op could satisfy a check the real job failed.
#
# Running full CI on docs-only PRs costs runner minutes. That is the cheaper error.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  NODE_LTS: "22.x"

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  # ============================================================
  # Stage 1: Fast validation (single Node LTS)
  # Deterministic checks that don't depend on Node version
  # ============================================================
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      # Pinned on purpose. An unpinned `pip install pyrefly` turned an untouched branch
      # red on 2026-07-31 when the package went 0.55.x -> 1.1.1 and the newer inference
      # flagged two pre-existing lines no commit had touched. Renovate tracks both
      # versions through the customManagers regex in .github/renovate.json5.
      # ruff is installed here rather than via astral-sh/ruff-action because
      # `validate:python` (inside validate:all) is the single definition of the Python
      # gate — the action would have been a second, silently divergent one.
      - name: Install pinned Python tooling
        working-directory: .
        run: pip install ruff==0.16.0 pyrefly==1.1.1 --quiet

      # The seven `validate:no-*` recurrence guards shell out to ripgrep, which the
      # GitHub runner image does not ship. This was latent until validate:all started
      # running in CI below — the guards exited 127 (`rg: not found`), not 0.
      - name: Install ripgrep
        run: sudo apt-get install -y --no-install-recommends ripgrep

      - name: Typecheck
        run: npm run typecheck

      # The whole suite, not a hand-picked subset. Before this, 16 of validate:all's 21
      # members ran in no automated gate — including all eight `validate:no-*` recurrence
      # guards, whose entire purpose is to make a retirement permanent. A PR reintroducing
      # `ChainSessionManager` or `StepState` merged green.
      # Members already covered elsewhere were removed from this job rather than run twice:
      # lint:ratchet, validate:contracts, validate:metadata, validate:versions, validate:arch.
      # Includes the Python gate: `validate:python` runs ruff check, ruff format --check
      # and pyrefly. There is no separate pyrefly step here on purpose — when pyrefly ran
      # only in CI, a clean local push could still fail it, which is how the 0.55 -> 1.1.1
      # breakage reached main.
      - name: Validate (full suite)
        run: npm run validate:all

  # The cpm CLI ships as the `cpm` bin of the claude-prompts npm package and
  # bundles server/src/cli-shared, so a server-side change can break it without
  # touching cli/. It is validated on every run, not on a path filter.
  cli:
    name: CLI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root workspaces)
        run: npm ci --prefer-offline --no-audit

      # cli/tsconfig.json maps @cli-shared/* into server/src, so typechecking the CLI
      # pulls in server sources that import zod. Those resolve from server/node_modules,
      # which the root workspace install does not provide.
      - name: Install server dependencies (CLI typechecks against server sources)
        run: npm ci --prefix server --prefer-offline --no-audit

      - name: Typecheck
        run: npm -w cli run typecheck

      # Build before test: the integration suite execs cli/dist/cpm.js
      - name: Build
        run: npm -w cli run build

      - name: Test
        run: npm -w cli run test:ci

  # ============================================================
  # Stage 2: Build (single Node LTS, upload artifact)
  # Build once, share with test matrix
  # ============================================================
  build:
    name: Build
    needs: lint
    if: ${{ always() && needs.lint.result != 'cancelled' && (github.event_name == 'pull_request' || needs.lint.result == 'success') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Build bundled distribution
        run: npm run build

      - name: Startup smoke test
        run: npm run start:test

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: server/dist/
          retention-days: 1

  # ============================================================
  # Stage 3: Test matrix (LTS versions only)
  # Download artifact, run tests on multiple Node versions
  # ============================================================
  test:
    name: Test (Node ${{ matrix.node }})
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 24 is what actually ships: every publish path (npm, extension) reads
      # .node-version, which is 24. Testing only 22.x meant a Node-24-specific regression
      # passed CI and shipped. 22.x stays because engines.node is ">=22.0.0".
      matrix:
        node: ["22.x", "24"]
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: server/dist/

      - name: Unit tests
        run: npm run test:ci
        timeout-minutes: 15

      - name: Coverage threshold check
        if: matrix.node == '22.x'
        run: npm run test:coverage
        timeout-minutes: 15

      # Integration tests were run by NO automated job before 2026-07-29 — not by
      # test:ci, not by pre-push, not by npm-publish — and rotted unnoticed to
      # 10 failing suites / 31 failing tests out of 349. They were made non-blocking
      # so the rot stayed visible while it was repaired; that debt is now paid and the
      # `continue-on-error` escape hatch is gone. Blocking is what keeps it paid.
      - name: Integration tests
        run: npm run test:integration
        timeout-minutes: 15

      - name: E2E tests
        run: npm run test:e2e

  # ============================================================
  # Stage 4: Matrix aggregator
  #
  # `Test (Node 22.x)` is a check-run name derived from a matrix value, so it changes
  # whenever the matrix changes — requiring it would re-create the "required context
  # nothing reports" bug the moment a Node version is added or dropped. This job's name
  # is a literal, so it is stable, and `needs.test.result` is only `success` when every
  # matrix leg succeeded. Require this one, never the interpolated ones.
  # ============================================================
  test-suite:
    name: Test Suite
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every matrix leg passed
        run: |
          echo "test matrix aggregate result: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = "success" ] || exit 1

  # ============================================================
  # PR Summary: Comment with validation results
  # ============================================================
  pr-summary:
    name: PR Summary
    needs: [lint, cli, build, test-suite]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Analyze changed files
        id: changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt 2>/dev/null; then
            echo "files=$(cat changed_files.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT
          else
            git diff --name-only HEAD~1 HEAD > changed_files.txt 2>/dev/null || echo "No changes" > changed_files.txt
            echo "files=$(cat changed_files.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR with results
        uses: actions/github-script@v9
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          CLI_RESULT: ${{ needs.cli.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test-suite.result }}
        with:
          script: |
            const fs = require('fs');
            let changedFiles = 'Unable to determine';
            try {
              changedFiles = fs.readFileSync('changed_files.txt', 'utf8').trim() || 'No changes detected';
            } catch (e) {
              console.log(`Could not read changed_files.txt: ${e.message}`);
            }

            const lintResult = process.env.LINT_RESULT || 'unknown';
            const cliResult = process.env.CLI_RESULT || 'unknown';
            const buildResult = process.env.BUILD_RESULT || 'unknown';
            const testResult = process.env.TEST_RESULT || 'unknown';
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;

            const statusEmoji = (result) => result === 'success' ? '✅' : result === 'skipped' ? '⏭️' : '❌';
            const allPassed = [lintResult, cliResult, buildResult, testResult].every((r) => r === 'success');

            const message = [
              allPassed ? '## ✅ CI Passed' : '## ❌ CI Failed',
              '',
              '| Stage | Status |',
              '|-------|--------|',
              `| Lint & Validate | ${statusEmoji(lintResult)} ${lintResult} |`,
              `| CLI | ${statusEmoji(cliResult)} ${cliResult} |`,
              `| Build | ${statusEmoji(buildResult)} ${buildResult} |`,
              `| Test Suite | ${statusEmoji(testResult)} ${testResult} |`,
              '',
              '<details>',
              '<summary>Files changed</summary>',
              '',
              '```',
              changedFiles,
              '```',
              '</details>',
              '',
              `[View workflow run](${runUrl})`
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const botComment = comments.data.find(c => c.user.type === 'Bot' && (c.body.includes('CI Passed') || c.body.includes('CI Failed')));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message
              });
            }
