name: CI

# Required CI deliberately has no workflow-level path filter: every protected context
# must report on every PR. The classifier below routes work *inside* this workflow, so
# documentation and hook-only changes avoid installs/builds/tests while mixed, unknown,
# configuration, dependency, and executable changes fail closed to the full suite.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  NODE_LTS: "22.x"

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read

jobs:
  classify:
    name: Classify validation scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.changes.outputs.scope }}
      full: ${{ steps.changes.outputs.full }}
      python: ${{ steps.changes.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"

      - name: Classify changed paths
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          changed_files="$RUNNER_TEMP/changed-files.txt"

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
            git diff --name-only --diff-filter=ACMRD "$PR_BASE_SHA...$GITHUB_SHA" > "$changed_files"
            git diff --check "$PR_BASE_SHA...$GITHUB_SHA"
          elif [ -n "$PUSH_BASE_SHA" ] && ! printf '%s' "$PUSH_BASE_SHA" | grep -Eq '^0+$' && git cat-file -e "$PUSH_BASE_SHA^{commit}"; then
            git diff --name-only --diff-filter=ACMRD "$PUSH_BASE_SHA..$GITHUB_SHA" > "$changed_files"
            git diff --check "$PUSH_BASE_SHA..$GITHUB_SHA"
          else
            git ls-tree -r --name-only "$GITHUB_SHA" > "$changed_files"
            git show --check --format= "$GITHUB_SHA"
          fi

          node scripts/classify-validation-scope.js --github-output "$GITHUB_OUTPUT" < "$changed_files"
          echo "Changed paths:"
          cat "$changed_files"

      - name: Summarize routing decision
        run: |
          echo "### Validation scope: \`${{ steps.changes.outputs.scope }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Full Node validation: \`${{ steps.changes.outputs.full }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Python validation: \`${{ steps.changes.outputs.python }}\`" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # Stage 1: Fast validation (single Node LTS)
  # Deterministic checks that don't depend on Node version
  # ============================================================
  lint:
    name: Lint & Validate
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Assert change classification passed
        working-directory: .
        run: |
          echo "classifier result: ${{ needs.classify.result }}"
          [ "${{ needs.classify.result }}" = "success" ] || exit 1

      - name: Checkout
        if: needs.classify.result == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        if: needs.classify.result == 'success' && needs.classify.outputs.scope != 'docs'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        if: needs.classify.outputs.scope == 'full'
        run: npm ci --prefer-offline --no-audit

      # Pinned on purpose. An unpinned `pip install pyrefly` turned an untouched branch
      # red on 2026-07-31 when the package went 0.55.x -> 1.1.1 and the newer inference
      # flagged two pre-existing lines no commit had touched. Renovate tracks Ruff,
      # Pyrefly, Pytest, and PyYAML through customManagers in .github/renovate.json5.
      # ruff is installed here rather than via astral-sh/ruff-action because
      # `validate:python` (inside validate:all) is the single definition of the Python
      # gate — the action would have been a second, silently divergent one.
      - name: Install Ruff
        if: needs.classify.result == 'success' && needs.classify.outputs.scope != 'docs'
        working-directory: .
        run: pip install ruff==0.16.1 --quiet

      - name: Install Pyrefly
        if: needs.classify.result == 'success' && needs.classify.outputs.scope != 'docs'
        working-directory: .
        run: pip install pyrefly==1.1.1 --quiet

      - name: Install Pytest
        if: needs.classify.result == 'success' && needs.classify.outputs.scope != 'docs'
        working-directory: .
        run: pip install pytest==9.1.1 --quiet

      - name: Install PyYAML
        if: needs.classify.result == 'success' && needs.classify.outputs.scope != 'docs'
        working-directory: .
        run: pip install PyYAML==6.0.3 --quiet

      # The seven `validate:no-*` recurrence guards shell out to ripgrep, which the
      # GitHub runner image does not ship. This was latent until validate:all started
      # running in CI below — the guards exited 127 (`rg: not found`), not 0.
      - name: Install ripgrep
        if: needs.classify.outputs.scope == 'full'
        run: sudo apt-get install -y --no-install-recommends ripgrep

      - name: Typecheck
        if: needs.classify.outputs.scope == 'full'
        run: npm run typecheck

      # The whole suite, not a hand-picked subset. Before this, 16 of validate:all's 21
      # members ran in no automated gate — including all eight `validate:no-*` recurrence
      # guards, whose entire purpose is to make a retirement permanent. A PR reintroducing
      # `ChainSessionManager` or `StepState` merged green.
      # Members already covered elsewhere were removed from this job rather than run twice:
      # lint:ratchet, validate:contracts, validate:metadata, validate:versions, validate:arch.
      # Includes the Python gate: `validate:python` runs Ruff, Pyrefly, and the hook
      # Pytest suite. There is no separate pyrefly/test step here on purpose — one
      # command is the local and hosted contract.
      - name: Validate (full suite)
        if: needs.classify.outputs.scope == 'full'
        run: npm run validate:all

      - name: Validate Python hooks
        if: needs.classify.outputs.scope == 'hooks'
        working-directory: .
        run: npm --prefix server run validate:python

      - name: Confirm lightweight validation
        if: needs.classify.outputs.scope != 'full'
        working-directory: .
        run: echo "${{ needs.classify.outputs.scope }} scope passed its selected validation"

  # The cpm CLI ships as the `cpm` bin of the claude-prompts npm package and
  # bundles server/src/cli-shared, so a server-side change can break it without
  # touching cli/. Every full-scope change validates it; safe scopes retain the
  # required job name and record why its heavy steps were omitted.
  cli:
    name: CLI
    needs: classify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert change classification passed
        run: |
          echo "classifier result: ${{ needs.classify.result }}"
          [ "${{ needs.classify.result }}" = "success" ] || exit 1

      - name: Record intentional lightweight pass
        if: needs.classify.result == 'success' && needs.classify.outputs.scope != 'full'
        run: echo "CLI is unaffected by the ${{ needs.classify.outputs.scope }} scope"

      - name: Checkout
        if: needs.classify.outputs.scope == 'full'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        if: needs.classify.outputs.scope == 'full'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root workspaces)
        if: needs.classify.outputs.scope == 'full'
        run: npm ci --prefer-offline --no-audit

      # cli/tsconfig.json maps @cli-shared/* into server/src, so typechecking the CLI
      # pulls in server sources that import zod. Those resolve from server/node_modules,
      # which the root workspace install does not provide.
      - name: Install server dependencies (CLI typechecks against server sources)
        if: needs.classify.outputs.scope == 'full'
        run: npm ci --prefix server --prefer-offline --no-audit

      - name: Typecheck
        if: needs.classify.outputs.scope == 'full'
        run: npm -w cli run typecheck

      # Build before test: the integration suite execs cli/dist/cpm.js
      - name: Build
        if: needs.classify.outputs.scope == 'full'
        run: npm -w cli run build

      - name: Test
        if: needs.classify.outputs.scope == 'full'
        run: npm -w cli run test:ci

  # ============================================================
  # Stage 2: Build (single Node LTS, upload artifact)
  # Build once, share with test matrix
  # ============================================================
  build:
    name: Build
    needs: [classify, lint]
    if: always()
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Assert prerequisite checks passed
        working-directory: .
        run: |
          echo "classifier result: ${{ needs.classify.result }}"
          echo "lint result: ${{ needs.lint.result }}"
          [ "${{ needs.classify.result }}" = "success" ]
          [ "${{ needs.lint.result }}" = "success" ]

      - name: Record intentional lightweight pass
        if: needs.classify.result == 'success' && needs.classify.outputs.scope != 'full'
        working-directory: .
        run: echo "Build is unaffected by the ${{ needs.classify.outputs.scope }} scope"

      - name: Checkout
        if: needs.classify.outputs.scope == 'full'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        if: needs.classify.outputs.scope == 'full'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_LTS }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        if: needs.classify.outputs.scope == 'full'
        run: npm ci --prefer-offline --no-audit

      - name: Build bundled distribution
        if: needs.classify.outputs.scope == 'full'
        run: npm run build

      - name: Startup smoke test
        if: needs.classify.outputs.scope == 'full'
        run: npm run start:test

      # Guards the published MCP tool surface, which CLAUDE.md places inside the Public
      # API Contract. The SDK selects its JSON Schema converter from the installed zod
      # major, so a dependency bump alone can rewrite every tool's inputSchema with no
      # typecheck or test failure — that is how the zod 3 -> 4 move produced 39 schema
      # changes. Lives here rather than in validate:all because it spawns the built
      # server, and validate:all runs before the build.
      - name: MCP tool schema snapshot
        if: needs.classify.outputs.scope == 'full'
        run: npm run validate:tool-schemas

      - name: Upload build artifact
        if: needs.classify.outputs.scope == 'full'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: server/dist/
          retention-days: 1

  # ============================================================
  # Stage 3: Test matrix (LTS versions only)
  # Download artifact, run tests on multiple Node versions
  # ============================================================
  test:
    name: Test (Node ${{ matrix.node }})
    needs: [classify, build]
    if: ${{ needs.classify.outputs.scope == 'full' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 24 is what actually ships: every publish path (npm, extension) reads
      # .node-version, which is 24. Testing only the minimum meant a Node-24-specific
      # regression passed CI and shipped. 22.13.0 proves the declared node:sqlite floor.
      matrix:
        node: ["22.13.0", "24"]
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: server/dist/

      - name: Unit tests
        run: npm run test:ci
        timeout-minutes: 15

      - name: Coverage threshold check
        if: matrix.node == '22.13.0'
        run: npm run test:coverage
        timeout-minutes: 15

      # Integration tests were run by NO automated job before 2026-07-29 — not by
      # test:ci, not by pre-push, not by npm-publish — and rotted unnoticed to
      # 10 failing suites / 31 failing tests out of 349. They were made non-blocking
      # so the rot stayed visible while it was repaired; that debt is now paid and the
      # `continue-on-error` escape hatch is gone. Blocking is what keeps it paid.
      - name: Integration tests
        run: npm run test:integration
        timeout-minutes: 15

      - name: E2E tests
        run: npm run test:e2e

  # ============================================================
  # Stage 4: Matrix aggregator
  #
  # `Test (Node 22.x)` is a check-run name derived from a matrix value, so it changes
  # whenever the matrix changes — requiring it would re-create the "required context
  # nothing reports" bug the moment a Node version is added or dropped. This job's name
  # is a literal, so it is stable, and `needs.test.result` is only `success` when every
  # matrix leg succeeded. Require this one, never the interpolated ones.
  # ============================================================
  test-suite:
    name: Test Suite
    needs: [classify, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert selected test scope passed
        run: |
          echo "classifier result: ${{ needs.classify.result }}"
          echo "validation scope: ${{ needs.classify.outputs.scope }}"
          echo "test matrix aggregate result: ${{ needs.test.result }}"
          [ "${{ needs.classify.result }}" = "success" ] || exit 1
          if [ "${{ needs.classify.outputs.scope }}" = "full" ]; then
            [ "${{ needs.test.result }}" = "success" ] || exit 1
          fi

  # ============================================================
  # PR Summary: Comment with validation results
  # ============================================================
  pr-summary:
    name: PR Summary
    needs: [classify, lint, cli, build, test-suite]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Analyze changed files
        id: changes
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt 2>/dev/null; then
            echo "files=$(cat changed_files.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT
          else
            git diff --name-only HEAD~1 HEAD > changed_files.txt 2>/dev/null || echo "No changes" > changed_files.txt
            echo "files=$(cat changed_files.txt | tr '\n' ' ')" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR with results
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          CLI_RESULT: ${{ needs.cli.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test-suite.result }}
          VALIDATION_SCOPE: ${{ needs.classify.outputs.scope }}
        with:
          script: |
            const fs = require('fs');
            let changedFiles = 'Unable to determine';
            try {
              changedFiles = fs.readFileSync('changed_files.txt', 'utf8').trim() || 'No changes detected';
            } catch (e) {
              console.log(`Could not read changed_files.txt: ${e.message}`);
            }

            const lintResult = process.env.LINT_RESULT || 'unknown';
            const cliResult = process.env.CLI_RESULT || 'unknown';
            const buildResult = process.env.BUILD_RESULT || 'unknown';
            const testResult = process.env.TEST_RESULT || 'unknown';
            const validationScope = process.env.VALIDATION_SCOPE || 'unknown';
            const runUrl = `${context.payload.repository.html_url}/actions/runs/${context.runId}`;

            const statusEmoji = (result) => result === 'success' ? '✅' : result === 'skipped' ? '⏭️' : '❌';
            const allPassed = [lintResult, cliResult, buildResult, testResult].every((r) => r === 'success');

            const message = [
              allPassed ? '## ✅ CI Passed' : '## ❌ CI Failed',
              '',
              `Validation scope: **${validationScope}**`,
              '',
              '| Stage | Status |',
              '|-------|--------|',
              `| Lint & Validate | ${statusEmoji(lintResult)} ${lintResult} |`,
              `| CLI | ${statusEmoji(cliResult)} ${cliResult} |`,
              `| Build | ${statusEmoji(buildResult)} ${buildResult} |`,
              `| Test Suite | ${statusEmoji(testResult)} ${testResult} |`,
              '',
              '<details>',
              '<summary>Files changed</summary>',
              '',
              '```',
              changedFiles,
              '```',
              '</details>',
              '',
              `[View workflow run](${runUrl})`
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const botComment = comments.data.find(c => c.user.type === 'Bot' && (c.body.includes('CI Passed') || c.body.includes('CI Failed')));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: message
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: message
              });
            }
