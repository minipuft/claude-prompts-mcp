name: Publish to MCP Registry

# Publishes root server.json to the official MCP registry after every successful
# npm publish, authenticating via GitHub Actions OIDC — the runner's identity
# proves ownership of the io.github.minipuft/* namespace, so no stored secret
# and no interactive login. The registry validates that the npm package named
# in server.json carries a matching mcpName, which is why this runs strictly
# after "Publish to npm" (the tarball must exist on the registry first).
on:
  workflow_run:
    workflows: ["Publish to npm"]
    types: [completed]
  # Manual recovery path — same reasoning as extension-publish: the job that
  # talks to an external service is the one that most often needs re-running.
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for mcp-publisher login github-oidc
  contents: read

env:
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  registry-publish:
    # The repository guard is fork courtesy, not security: a fork's OIDC token
    # carries its own owner, so the registry would reject its attempt to publish
    # io.github.minipuft/* anyway — this just skips cleanly instead of failing
    # with a confusing namespace error in someone else's Actions tab.
    if: >-
      github.repository == 'minipuft/claude-prompts-mcp'
      && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Install mcp-publisher (pinned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$MCP_PUBLISHER_VERSION" \
            --repo modelcontextprotocol/registry \
            --pattern 'mcp-publisher_linux_amd64.tar.gz'
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          sudo install -m 0755 mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version

      - name: Skip if the registry already serves this version
        id: precheck
        run: |
          set -euo pipefail
          expected=$(jq -r .version server.json)
          name=$(jq -r .name server.json)
          got=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=${name}" \
            | jq -r --arg n "$name" '[.servers[]?.server | select(.name == $n)][0].version // empty') || got=""
          if [ "$got" = "$expected" ]; then
            echo "Registry already serves ${name}@${expected} — nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate via OIDC
        if: steps.precheck.outputs.skip != 'true'
        run: mcp-publisher login github-oidc

      - name: Publish server.json
        if: steps.precheck.outputs.skip != 'true'
        run: mcp-publisher publish

      - name: Verify the listing serves this version
        if: steps.precheck.outputs.skip != 'true'
        run: |
          set -euo pipefail
          expected=$(jq -r .version server.json)
          name=$(jq -r .name server.json)
          # Select the entry the registry FLAGS as latest, not the first one the search happens
          # to return. The search endpoint serves every published version of a server, and
          # ordering is not a contract — measured 2026-08-15, `[0]` was 3.2.1 while 4.0.0 was
          # already live, so all five attempts read the old version and the step failed a
          # release that had in fact published. `publishedAt` on the 4.0.0 record equalled the
          # publish step's own success timestamp to the millisecond, so there was never any
          # propagation lag to wait out: widening the window would have failed identically,
          # just later. `isLatest` is also the stronger claim — it distinguishes "this version
          # exists somewhere in the list" from "this version is what clients now resolve".
          for attempt in 1 2 3 4 5 6 7 8; do
            got=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=${name}" \
              | jq -r --arg n "$name" '[.servers[]?
                  | select(.server.name == $n)
                  | select(._meta["io.modelcontextprotocol.registry/official"].isLatest == true)
                  | .server.version][0] // empty') || got=""
            if [ "$got" = "$expected" ]; then
              echo "Registry serves ${name}@${got} as latest"
              exit 0
            fi
            echo "attempt ${attempt}/8: registry serves '${got:-nothing}' as latest, want ${expected}"
            sleep 30
          done
          echo "ERROR: registry never served ${name}@${expected} as latest"
          exit 1
