name: Downstream Sync

on:
  repository_dispatch:
    types: [downstream-release]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Parse dispatch payload
        id: payload
        run: |
          echo "source=${{ github.event.client_payload.source }}" >> "$GITHUB_OUTPUT"
          echo "version=${{ github.event.client_payload.version }}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".node-version"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      # Report-only, deliberately. This workflow reacts to an already-published release;
      # failing it cannot un-publish anything, and a red X here would only train people to
      # ignore the run. The Summary step below surfaces `steps.validate.outcome` so the
      # result is still visible.
      #
      # What retires this `continue-on-error` (cleanup-standards: a gate you cannot retire
      # is a bug): move the same check into a step that runs BEFORE publish — in
      # npm-publish.yml or the Build job — where failing it prevents the bad artifact
      # rather than reporting on it. At that point this step is redundant and gets deleted
      # outright rather than made blocking.
      - name: Validate distribution versions
        id: validate
        working-directory: server
        continue-on-error: true
        run: node scripts/validate-versions.js --distribution --skip-npm

      - name: Summary
        if: always()
        run: |
          echo "## Downstream Sync" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Source | \`${{ steps.payload.outputs.source }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.payload.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | ${{ steps.payload.outputs.timestamp }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Validation | ${{ steps.validate.outcome }} |" >> $GITHUB_STEP_SUMMARY
