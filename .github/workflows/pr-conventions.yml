name: PR Conventions

# Checks that a pull request body was written FOR A READER, that its title is a conventional commit
# the repo's own commitlint accepts, and supplies the parts a machine can derive. Companion to
# CONTRIBUTING.md §Pull Request Process, .github/pull_request_template.md, and
# scripts/validate-pr-body.mjs (which owns the body rules — this file only calls it).
#
# WHY IT EXISTS. Measured 2026-08-28: `gh pr create --body "..."` bypasses the template silently,
# and PR #249 opened with invented headings, no verification section, and none of the 18 available
# labels. Measured again 2026-09-01: #254 and #255 satisfied that check and were still unreadable —
# 651 and 866 words of session-voice prose, no demonstration of a shipped state machine, a
# verification section that was a count wall — and the squash-merge commit GitHub wrote for #254
# concatenated 27 commit bodies into 4,615 words. Presence was never the property.
#
# WHAT IT MEASURES, stated exactly:
#   · the three load-bearing sections exist and are NON-EMPTY once HTML comments are stripped;
#   · `## Demonstration` is non-empty when the title's type is feat/fix/perf/refactor (`n/a: <why>`
#     counts — the author must DECIDE, not decorate);
#   · the title passes `commitlint` with commitlint.config.mjs — the same config every commit
#     meets, so the squash-merge title (release-please's changelog line) cannot drift from it.
#   Advisory warnings: body over 400 words; a verification section with no table or fenced block.
#   It does NOT judge prose quality, and it deliberately does not gate labels: the type label is
#   derived here automatically, and a gate you satisfy automatically is theatre.
#
# REQUIRED SINCE 2026-09-02 (listed in `.github/required-contexts.json`). The original flip
# condition — five consecutive clean PRs, zero false positives — was dropped by an operator
# ruling: it had no counter and no detector (the exact "retirability without detection" failure
# cleanup-standards.md names), and it was unsatisfiable anyway, because every renovate and
# release-please PR failed the body check from the day the gate existed (#252, #253 probed
# FAILURE 2026-09-01). Bot PRs are now exempt from the authored-body checks — their bodies and
# titles are machine-owned surface — which removes the known false-positive sources; a wrong
# failure after this is a defect to fix, not a count to reset.
#
# This workflow also asserts the merge-settings contract by its EFFECT (the newest squash on
# main carries a PR-shaped body): the settings are invisible to any file-based gate AND to the
# workflow token, and the two-register body design depends on them — the collapsed appendix
# reaches main's history only because the squash body does.
#
# That assertion is a WARNING, never a failure, and the reason is structural rather than a
# tolerance for drift. Its subject is the newest squash commit on main — state no pull request
# controls, and state that ONLY a merge can change. A required check whose subject is mutable
# only by the action it gates is a deadlock by construction: the offending merge has already
# landed, so failing cannot prevent it, and the sole thing that clears the check is the next
# merge, which the failure blocks. Measured 2026-09-08: merging #265 with an overriding
# `--body` left #269 MERGEABLE/BLOCKED, and clearing it took an admin bypass. Blocking here
# buys nothing and costs the repair path.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventions:
    name: PR Conventions
    runs-on: ubuntu-latest
    steps:
      - name: Derive the type label from the conventional-commit title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Derived, never demanded. The conventional-commit type is already validated by
            // commitlint on every commit and by the squash-merge title, so inferring from it
            // cannot disagree with the tree. `security` and `breaking` are NOT inferable and stay
            // a human decision — which is exactly why this step does not fail when they are absent.
            const title = context.payload.pull_request.title || '';
            const type = (title.match(/^([a-z]+)(\(|!|:)/) || [])[1];
            const map = {
              fix: 'bug',
              feat: 'enhancement',
              docs: 'documentation',
              perf: 'enhancement',
              refactor: 'enhancement',
            };
            const label = map[type];
            if (!label) {
              core.info(`No label mapping for type "${type}" — leaving labels alone.`);
              return;
            }
            const existing = context.payload.pull_request.labels.map((l) => l.name);
            if (existing.includes(label)) {
              core.info(`Label "${label}" already present.`);
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });
            core.info(`Applied "${label}".`);

      - name: Assert the merge-settings contract by its effect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // The merge-settings fields on repos.get are visible only to admin tokens, and the
            // workflow GITHUB_TOKEN is not one — probed 2026-09-02 on #259, where all three
            // fields read `undefined` and the first version of this step failed on its own PR.
            // A probe that cannot observe must not stand as a gate, so assert the EFFECT the
            // contract exists for: the newest squash merge on the default branch must carry a
            // PR-shaped body (PR_BODY squash opens with a `## ` heading). Detection lags by one
            // merge — the best a non-admin observer can do, and it fires before the NEXT merge
            // compounds the drift. delete_branch_on_merge has no non-admin observable and is
            // deliberately not asserted; it is convenience, not contract.
            const { data: commits } = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 20,
            });
            const squashes = commits.filter((c) =>
              /\(#\d+\)$/.test(c.commit.message.split('\n')[0])
            );
            if (squashes.length === 0) {
              core.info('No squash-shaped commit in the last 20 on the default branch.');
              return;
            }
            const carriesBody = (c) =>
              /^## /m.test(c.commit.message.split('\n').slice(1).join('\n'));
            const newest = squashes[0];
            const sha = newest.sha.slice(0, 8);
            if (carriesBody(newest)) {
              core.info(`Squash ${sha} carries a PR-shaped body — contract holds.`);
              return;
            }

            // Two causes produce an identical bodyless commit, and they need opposite fixes. They
            // ARE separable from evidence, because they differ in BLAST RADIUS: a drifted setting
            // strips every squash after it, while `gh pr merge --subject/--body` overrides the
            // setting for one merge and leaves its neighbours intact. The first version of this
            // message named only the setting, and sent a reader to re-apply one that was already
            // correct (measured 2026-09-08, cost real debugging time).
            const priorWithBody = squashes.slice(1).find(carriesBody);
            const reapply =
              '  gh api -X PATCH repos/' + context.repo.owner + '/' + context.repo.repo + ' \\\n' +
              '    -f squash_merge_commit_title=PR_TITLE -f squash_merge_commit_message=PR_BODY \\\n' +
              '    -F delete_branch_on_merge=true';
            const diagnosis = priorWithBody
              ? `An older squash (${priorWithBody.sha.slice(0, 8)}) DOES carry one, so the ` +
                'repository setting is probably fine and this was a single overriding merge — ' +
                'someone passed `--subject`/`--body` to `gh pr merge`, which overrides ' +
                'squash_merge_commit_message for that merge only. Nothing to repair: merge the ' +
                'next PR with `gh pr merge <n> --squash` and nothing else, and this clears.\n\n' +
                'Verify before changing settings:\n' +
                `  gh api repos/${context.repo.owner}/${context.repo.repo} -q .squash_merge_commit_message`
              : 'No recent squash carries one either, which is the signature of a drifted ' +
                'repository setting rather than a one-off merge. Verify, then reapply:\n' +
                `  gh api repos/${context.repo.owner}/${context.repo.repo} -q .squash_merge_commit_message\n` +
                reapply;

            core.warning(
              `Squash commit ${sha} does not carry a PR-shaped body.\n\n${diagnosis}\n\n` +
                'Reported as a warning, not a failure, on purpose: this check reads main\'s newest ' +
                'squash, which no pull request controls and only a merge can change. Failing would ' +
                'block the very merge that clears it while doing nothing about the merge that ' +
                'caused it — see this workflow\'s header.'
            );

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The plan-footer check measures which rows this PR closes by comparing the plan against
          # its state at the merge base, so it needs history the default `fetch-depth: 1` does not
          # fetch. The check fails loudly when the base is unreadable rather than passing, so a
          # regression here surfaces as a red gate on every PR carrying a footer, not as a silent
          # green — but it would be a wrong red, so keep this.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Prove the body check can fail (positive control)
        if: github.event.pull_request.user.type != 'Bot'
        run: node scripts/validate-pr-body.mjs --self-test

      # The self-test above drives the plan rules off fixtures, so it proves the RULES and says
      # nothing about whether this checkout can supply them a base to compare against. That gap is
      # where the `fetch-depth` regression lives: a shallow checkout does not error, it compares the
      # plan against itself and reports "closes no rows" for every PR. Asserted on every PR, not
      # only ones carrying a footer, because the configuration is repository-wide.
      - name: Prove the checkout can measure plan progress (positive control)
        if: github.event.pull_request.user.type != 'Bot'
        run: node scripts/validate-pr-body.mjs --assert-base-measurable

      - name: Check the body against the template (scripts/validate-pr-body.mjs)
        if: github.event.pull_request.user.type != 'Bot'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/validate-pr-body.mjs

      - name: Lint the title with the repo's commitlint config
        if: github.event.pull_request.user.type != 'Bot'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        # Root package.json holds only commitlint + husky; `--ignore-scripts` skips the husky
        # `prepare` step, which has nothing to wire on a CI checkout.
        run: |
          npm ci --ignore-scripts
          printf '%s\n' "$PR_TITLE" | npx --no -- commitlint --verbose
