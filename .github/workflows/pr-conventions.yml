name: PR Conventions

# Checks that a pull request body was written FOR A READER, that its title is a conventional commit
# the repo's own commitlint accepts, and supplies the parts a machine can derive. Companion to
# CONTRIBUTING.md §Pull Request Process, .github/pull_request_template.md, and
# scripts/validate-pr-body.mjs (which owns the body rules — this file only calls it).
#
# WHY IT EXISTS. Measured 2026-08-28: `gh pr create --body "..."` bypasses the template silently,
# and PR #249 opened with invented headings, no verification section, and none of the 18 available
# labels. Measured again 2026-09-01: #254 and #255 satisfied that check and were still unreadable —
# 651 and 866 words of session-voice prose, no demonstration of a shipped state machine, a
# verification section that was a count wall — and the squash-merge commit GitHub wrote for #254
# concatenated 27 commit bodies into 4,615 words. Presence was never the property.
#
# WHAT IT MEASURES, stated exactly:
#   · the three load-bearing sections exist and are NON-EMPTY once HTML comments are stripped;
#   · `## Demonstration` is non-empty when the title's type is feat/fix/perf/refactor (`n/a: <why>`
#     counts — the author must DECIDE, not decorate);
#   · the title passes `commitlint` with commitlint.config.mjs — the same config every commit
#     meets, so the squash-merge title (release-please's changelog line) cannot drift from it.
#   Advisory warnings: body over 400 words; a verification section with no table or fenced block.
#   It does NOT judge prose quality, and it deliberately does not gate labels: the type label is
#   derived here automatically, and a gate you satisfy automatically is theatre.
#
# REQUIRED SINCE 2026-09-02 (listed in `.github/required-contexts.json`). The original flip
# condition — five consecutive clean PRs, zero false positives — was dropped by an operator
# ruling: it had no counter and no detector (the exact "retirability without detection" failure
# cleanup-standards.md names), and it was unsatisfiable anyway, because every renovate and
# release-please PR failed the body check from the day the gate existed (#252, #253 probed
# FAILURE 2026-09-01). Bot PRs are now exempt from the authored-body checks — their bodies and
# titles are machine-owned surface — which removes the known false-positive sources; a wrong
# failure after this is a defect to fix, not a count to reset.
#
# This workflow also asserts the merge-settings contract (squash carries PR_TITLE + PR_BODY,
# branches delete on merge): those are repository SETTINGS, invisible to any file-based gate,
# and the two-register body design depends on them — the collapsed appendix reaches main's
# history only because the squash body does.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-conventions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventions:
    name: PR Conventions
    runs-on: ubuntu-latest
    steps:
      - name: Derive the type label from the conventional-commit title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Derived, never demanded. The conventional-commit type is already validated by
            // commitlint on every commit and by the squash-merge title, so inferring from it
            // cannot disagree with the tree. `security` and `breaking` are NOT inferable and stay
            // a human decision — which is exactly why this step does not fail when they are absent.
            const title = context.payload.pull_request.title || '';
            const type = (title.match(/^([a-z]+)(\(|!|:)/) || [])[1];
            const map = {
              fix: 'bug',
              feat: 'enhancement',
              docs: 'documentation',
              perf: 'enhancement',
              refactor: 'enhancement',
            };
            const label = map[type];
            if (!label) {
              core.info(`No label mapping for type "${type}" — leaving labels alone.`);
              return;
            }
            const existing = context.payload.pull_request.labels.map((l) => l.name);
            if (existing.includes(label)) {
              core.info(`Label "${label}" already present.`);
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });
            core.info(`Applied "${label}".`);

      - name: Assert the merge-settings contract still holds
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const expected = {
              squash_merge_commit_title: 'PR_TITLE',
              squash_merge_commit_message: 'PR_BODY',
              delete_branch_on_merge: true,
            };
            const drifted = Object.entries(expected).filter(([k, v]) => data[k] !== v);
            if (drifted.length === 0) {
              core.info('Merge settings match the contract.');
              return;
            }
            for (const [k, v] of drifted) core.error(`${k} is ${data[k]}, expected ${v}`);
            core.setFailed(
              'Repository merge settings drifted from the two-register body contract. Reapply:\n' +
                '  gh api -X PATCH repos/' + context.repo.owner + '/' + context.repo.repo + ' \\\n' +
                '    -f squash_merge_commit_title=PR_TITLE -f squash_merge_commit_message=PR_BODY \\\n' +
                '    -F delete_branch_on_merge=true'
            );

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Prove the body check can fail (positive control)
        if: github.event.pull_request.user.type != 'Bot'
        run: node scripts/validate-pr-body.mjs --self-test

      - name: Check the body against the template (scripts/validate-pr-body.mjs)
        if: github.event.pull_request.user.type != 'Bot'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/validate-pr-body.mjs

      - name: Lint the title with the repo's commitlint config
        if: github.event.pull_request.user.type != 'Bot'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        # Root package.json holds only commitlint + husky; `--ignore-scripts` skips the husky
        # `prepare` step, which has nothing to wire on a CI checkout.
        run: |
          npm ci --ignore-scripts
          printf '%s\n' "$PR_TITLE" | npx --no -- commitlint --verbose
